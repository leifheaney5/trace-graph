name: CI
on:
  push:
permissions:
  contents: write
concurrency:
  group: tracegraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md docs/case-study.md
      - name: Commit formatted documentation
        run: |
          if ! git diff --quiet -- README.md docs/case-study.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md docs/case-study.md
            git commit -m "style: format final v2 documentation [skip ci]"
            git push
          fi
