name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
concurrency:
  group: tracegraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format v2 files
        run: npx prettier --write src/digitalThread.ts src/DigitalThreadWorkbench.tsx src/digital-thread-workbench.css src/digitalThread.test.ts src/main.tsx tests/e2e/accessibility.spec.ts tests/e2e/digital-thread-workbench.spec.ts
      - name: Commit deterministic formatting
        run: |
          if ! git diff --quiet -- src/digitalThread.ts src/DigitalThreadWorkbench.tsx src/digital-thread-workbench.css src/digitalThread.test.ts src/main.tsx tests/e2e/accessibility.spec.ts tests/e2e/digital-thread-workbench.spec.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/digitalThread.ts src/DigitalThreadWorkbench.tsx src/digital-thread-workbench.css src/digitalThread.test.ts src/main.tsx tests/e2e/accessibility.spec.ts tests/e2e/digital-thread-workbench.spec.ts
            git commit -m "style: format digital-thread v2 files [skip ci]"
            git push
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run test:accessibility
      - run: npm run build
      - name: Upload case-study screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracegraph-case-study-screenshots
          path: docs/screenshots/case-study-*.png
          if-no-files-found: warn
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
