name: CI
on:
  push:
concurrency:
  group: tracegraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  dependency-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Trace vulnerable transitive packages
        run: npm ls nanoid postcss || true
      - name: Update only identified transitive packages within parent ranges
        run: npm update nanoid postcss --package-lock-only --ignore-scripts
      - name: Verify repaired lockfile installs cleanly
        run: npm ci
      - name: Verify dependency audit
        run: npm audit --json
      - name: Commit repaired lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update vulnerable transitive dependencies [skip ci]"
            git push
          fi
