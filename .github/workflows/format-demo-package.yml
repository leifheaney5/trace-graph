name: Format TraceGraph demo package

on:
  push:
    branches:
      - feat/tracegraph-initial-platform
    paths:
      - .github/workflows/format-demo-package.yml

permissions:
  contents: write

jobs:
  format-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format demo text assets
        run: npx prettier --write demo/index.html demo/marketing/messaging.md demo/record-demo.mjs
      - name: Remove one-use formatter and commit
        run: |
          rm .github/workflows/format-demo-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html demo/marketing/messaging.md demo/record-demo.mjs .github/workflows/format-demo-package.yml
          git commit -m "style: format demo package"
          git push origin HEAD:feat/tracegraph-initial-platform
      - name: Mirror formatted history to main
        run: git push origin HEAD:main
      - name: Verify clean worktree
        run: |
          test -z "$(git status --porcelain)"
          echo "Worktree clean at $(git rev-parse HEAD)"
