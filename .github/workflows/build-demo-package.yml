name: Build TraceGraph demo package

on:
  push:
    branches:
      - feat/tracegraph-initial-platform
    paths:
      - .github/workflows/build-demo-package.yml

permissions:
  contents: write

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start TraceGraph
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/tracegraph-vite.log 2>&1 &
          echo $! > /tmp/tracegraph-vite.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tracegraph-vite.log
          exit 1
      - name: Record live browser walkthrough
        run: node demo/record-demo.mjs
      - name: Package case-study screenshots
        run: |
          mkdir -p demo/screenshots
          cp docs/screenshots/case-study-*.png demo/screenshots/
          test "$(find demo/screenshots -maxdepth 1 -name 'case-study-*.png' | wc -l)" -eq 13
          test -s demo/video/tracegraph-live-demo.webm
      - name: Remove one-use workflow and commit media
        run: |
          rm .github/workflows/build-demo-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo .github/workflows/build-demo-package.yml
          git commit -m "demo: package live walkthrough and media"
          git push origin HEAD:feat/tracegraph-initial-platform
      - name: Mirror cleaned release history to main
        run: git push origin HEAD:main
      - name: Remove merged feature branch
        run: git push origin --delete feat/tracegraph-digital-thread-v2 || true
      - name: Verify clean worktree
        run: |
          test -z "$(git status --porcelain)"
          echo "Worktree clean at $(git rev-parse HEAD)"
