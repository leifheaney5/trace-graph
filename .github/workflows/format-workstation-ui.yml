name: Format workstation UI once

on:
  push:
    branches:
      - feat/tracegraph-workstation-ui
    paths:
      - .github/workflows/format-workstation-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format workstation styles
        run: npx prettier --write src/workstation-ui.css src/workstation-detail.css
      - name: Remove one-use formatter and commit
        run: |
          rm .github/workflows/format-workstation-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workstation-ui.css src/workstation-detail.css .github/workflows/format-workstation-ui.yml
          git commit -m "style: format workstation visual system"
          git push origin HEAD:feat/tracegraph-workstation-ui
      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
